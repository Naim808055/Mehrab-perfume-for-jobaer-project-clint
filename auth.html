<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account & Login - MEHRAB PERFUME</title>
  <meta name="description" content="Log in or register your customer account at Mehrab Perfume.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-bar-notice">
        <span>✨</span> Mehrab Perfume Customer Portal
      </div>
      <div class="top-bar-links">
        <a href="https://wa.me/8801938199254" target="_blank" class="top-bar-link">
          <span>📞 Hotline:</span> <strong>01938199254</strong>
        </a>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <header class="main-nav">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <img src="/public/assets/logo.png" alt="MEHRAB PERFUME" class="nav-logo-img">
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="shop.html" class="nav-link">Shop</a></li>
          <li><a href="cart.html" class="nav-link">Cart</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="nav-icon-btn" title="View Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
    <div class="auth-card">
      
      <!-- Logo Branding in Card -->
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img src="/public/assets/logo.png" alt="Mehrab Perfume" style="height: 52px; width: auto; max-width: 220px; object-fit: contain; margin: 0 auto 0.75rem; display: block; filter: drop-shadow(0 0 1px rgba(255,255,255,0.4));">
        <h1 style="font-size: 1.6rem; color: var(--color-white);">Customer Portal</h1>
      </div>

      <!-- Tabs Switcher -->
      <div class="auth-tabs">
        <button id="tabLoginBtn" class="auth-tab active">Log In</button>
        <button id="tabRegisterBtn" class="auth-tab">Register</button>
      </div>

      <!-- LOGIN FORM WRAPPER -->
      <div id="loginFormWrapper">
        <div id="loginErrorMsg" style="display: none; background: rgba(244, 67, 54, 0.15); border: 1px solid #f44336; color: #ff8a80; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

        <form id="customerLoginForm">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address *</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@email.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password *</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-gold btn-block" style="padding: 0.95rem; margin-top: 1rem; font-size: 1rem;">
            Log In to Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--color-gray-text);">
          Don't have an account yet? 
          <a href="#" id="linkToRegister" style="color: var(--color-gold); font-weight: 600; margin-left: 0.25rem;">Create Account</a>
        </div>
      </div>

      <!-- REGISTRATION FORM WRAPPER -->
      <div id="registerFormWrapper" style="display: none;">
        <div id="registerErrorMsg" style="display: none; background: rgba(244, 67, 54, 0.15); border: 1px solid #f44336; color: #ff8a80; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

        <form id="customerRegisterForm">
          <div class="form-group">
            <label class="form-label" for="regFullName">Full Name *</label>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Mohammad Rahman" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="name@email.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPhone">Phone Number *</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="01XXXXXXXXX" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPassword">Password (Min 6 chars) *</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" minlength="6" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-gold btn-block" style="padding: 0.95rem; margin-top: 1rem; font-size: 1rem;">
            Create Customer Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--color-gray-text);">
          Already have an account? 
          <a href="#" id="linkToLogin" style="color: var(--color-gold); font-weight: 600; margin-left: 0.25rem;">Log In</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0; justify-content: center;">
        <div>© 2026 MEHRAB PERFUME. All Rights Reserved.</div>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
