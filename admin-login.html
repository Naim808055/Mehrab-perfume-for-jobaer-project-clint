<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - MEHRAB PERFUME</title>
  <meta name="description" content="Secure administrative authentication for Mehrab Perfume store management.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #112030 0%, #04090e 100%);">

  <div class="auth-card" style="margin: 2rem auto; width: 100%; max-width: 440px;">
    
    <!-- Brand Crest -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="/public/assets/logo.png" alt="Mehrab Perfume" style="height: 58px; width: auto; max-width: 240px; object-fit: contain; margin: 0 auto 1rem; display: block; filter: drop-shadow(0 0 1px rgba(255,255,255,0.4));">
      <h1 style="font-size: 1.5rem; color: var(--color-gold-light);">Administration Portal</h1>
      <p style="font-size: 0.85rem; color: var(--color-gray-text); margin-top: 0.25rem;">
        Authorized Store Management System
      </p>
    </div>

    <!-- Error Banner -->
    <div id="adminLoginError" style="display: none; background: rgba(244, 67, 54, 0.15); border: 1px solid #f44336; color: #ff8a80; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="adminUsername">Administrator Email / Username</label>
        <input type="text" id="adminUsername" class="form-control" placeholder="admin@mehrabperfume.com" value="admin@mehrabperfume.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Security Password</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" value="admin123456" required>
      </div>

      <button type="submit" class="btn btn-gold btn-block" style="padding: 1rem; margin-top: 1rem; font-size: 1rem;">
        Authenticate & Enter Dashboard
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--color-border-subtle); text-align: center; font-size: 0.8rem; color: var(--color-gray-text);">
      <p style="margin-bottom: 0.5rem; color: var(--color-gold);">Default Demo Credentials:</p>
      <p>Email: <code>admin@mehrabperfume.com</code></p>
      <p>Password: <code>admin123456</code></p>
      <div style="margin-top: 1rem;">
        <a href="index.html" style="color: var(--color-cream); text-decoration: underline;">← Return to Public Storefront</a>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
